spring:
  application:
    name: ShiveStore

  data:
    mongodb:
      # MongoDB Atlas connection URI
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://brandstore111111_db_user:1pLQbJVtQXEY070x@cluster0.b146y9k.mongodb.net/shiv_store_db?retryWrites=true&w=majority}
      database: shiv_store_db

  # Gmail SMTP Configuration for Password Reset Emails
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 3001

logging:
  level:
    com.ShivStore: INFO
    org.springframework.data.mongodb: INFO

# JWT Configuration
# ⚠️ Set JWT_SECRET as an environment variable in production.
# Must be at least 256 bits (32+ characters). Local fallback default used when not set.
jwt:
  secret: ${JWT_SECRET:ShivStoreSecretKeyForJWTAuthenticationMustBeAtLeast256BitsLong2026}
  expiration-ms: 21600000   # 6 hours in milliseconds

# AWS S3 Configuration for Database Backups
aws:
  s3:
    enabled: ${AWS_S3_ENABLED:true}
    bucket: ${AWS_S3_BUCKET_NAME:}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    backup-folder: ${AWS_S3_BACKUP_FOLDER:backups}

# Scheduled Backup Configuration (Default: 0 0 0 * * ? -> Every night at 12:00 AM)
backup:
  cron: ${BACKUP_CRON_EXPRESSION:0 0 0 * * ?}

