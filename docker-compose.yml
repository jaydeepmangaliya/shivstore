version: '3.8'

services:
  # ── Spring Boot Backend Service ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shivstore-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
    networks:
      - shivstore-network

  # ── React Frontend Service (Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shivstore-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - shivstore-network

networks:
  shivstore-network:
    driver: bridge
