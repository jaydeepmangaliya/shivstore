version: '3.8'

services:
  # ── Spring Boot Backend Service ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shivstore-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI:-mongodb+srv://brandstore111111_db_user:1pLQbJVtQXEY070x@cluster0.b146y9k.mongodb.net/shiv_store_db?retryWrites=true&w=majority}
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://brandstore111111_db_user:1pLQbJVtQXEY070x@cluster0.b146y9k.mongodb.net/shiv_store_db?retryWrites=true&w=majority}
      - JWT_SECRET=${JWT_SECRET:-ShivStoreSecretKeyForJWTAuthenticationMustBeAtLeast256BitsLong2026}
      - GMAIL_USERNAME=${GMAIL_USERNAME:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - AWS_S3_ENABLED=${AWS_S3_ENABLED:-true}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BACKUP_FOLDER=${AWS_S3_BACKUP_FOLDER:-backups}
      - BACKUP_CRON_EXPRESSION=${BACKUP_CRON_EXPRESSION:-0 0 0 * * ?}
    networks:
      - shivstore-network

  # ── React Frontend Service (Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shivstore-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - shivstore-network

networks:
  shivstore-network:
    driver: bridge
