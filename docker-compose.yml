version: '3.8'

services:
  # ── Spring Boot Backend Service ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shivstore-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://brandstore111111_db_user:1pLQbJVtQXEY070x@cluster0.b146y9k.mongodb.net/shiv_store_db?retryWrites=true&w=majority}
      - JWT_SECRET=${JWT_SECRET:-ShivStoreSecretKeyForJWTAuthenticationMustBeAtLeast256BitsLong2026}
      - GMAIL_USERNAME=${GMAIL_USERNAME:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
    networks:
      - shivstore-network

  # ── React Frontend Service (Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shivstore-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - shivstore-network

networks:
  shivstore-network:
    driver: bridge
