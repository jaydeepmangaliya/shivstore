<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#818cf8"/>
      <stop offset="45%" stopColor="#7c3aed"/>
      <stop offset="100%" stopColor="#6366f1"/>
    </linearGradient>
    <filter id="sShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" floodColor="#1e1b4b" floodOpacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Glow Ring -->
  <rect x="1" y="1" width="62" height="62" rx="17" fill="rgba(129, 140, 248, 0.3)" />
  
  <!-- Vibrant Squircle Badge -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
  
  <!-- Top Glass Highlight Reflection -->
  <path d="M 3 19 C 3 10.16 10.16 3 19 3 L 45 3 C 53.84 3 61 10.16 61 19 L 61 24 C 44 29 20 29 3 24 Z" fill="#ffffff" fill-opacity="0.2" />
  
  <!-- Bold Crisp White S Monogram -->
  <path d="M 42 22.5 C 42 17 37.8 14 32 14 C 26 14 22 17.5 22 22.8 C 22 28.5 26 31.5 32 32.5 C 38 33.8 42 36.8 42 42.2 C 42 47.8 37.5 50.5 32 50.5 C 26 50.5 22 47.5 22 42" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#sShadow)" />
        
  <!-- Top Right Accent Dot -->
  <circle cx="42" cy="17.5" r="3.2" fill="#c7d2fe" />
  <!-- Bottom Left Accent Dot -->
  <circle cx="22" cy="46.5" r="3.2" fill="#a5b4fc" />
</svg>