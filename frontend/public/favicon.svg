<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Squircle Gradient -->
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4f46e5" />
      <stop offset="50%" stopColor="#7c3aed" />
      <stop offset="100%" stopColor="#9333ea" />
    </linearGradient>

    <!-- S Monogram Stroke Gradient -->
    <linearGradient id="sGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#f8fafc" />
    </linearGradient>

    <!-- Drop Shadow for S -->
    <filter id="sShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Glass Ring -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="rgba(124, 58, 237, 0.25)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />

  <!-- Main Rounded Squircle Badge -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#badgeGrad)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" />

  <!-- Inner Soft Light -->
  <rect x="8" y="8" width="48" height="24" rx="14" fill="rgba(255, 255, 255, 0.15)" />

  <!-- Modern Elegant 'S' Monogram -->
  <path
    d="M40 21.5C40 17.5 36.5 15 32 15H25C20.5 15 17 18.5 17 23C17 27.5 20.5 31 25 31H39C43.5 31 47 34.5 47 39C47 43.5 43.5 47 39 47H32C27.5 47 24 44.5 24 40.5"
    stroke="url(#sGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#sShadow)"
  />

  <!-- Top Right & Bottom Left Accent Dots -->
  <circle cx="43" cy="18" r="2.8" fill="#c4b5fd" />
  <circle cx="21" cy="44" r="2.8" fill="#818cf8" />
</svg>